name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Needed to build the linux/arm64 leg below under QEMU emulation; the
      # runner itself is amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" (moves with main) and "sha-<short-sha>" (immutable,
      # traceable back to the exact commit). metadata-action lowercases the
      # image name automatically, which GHCR requires.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # linux/amd64,linux/arm64: det publiserte imaget må kunne kjøres
      # direkte på begge vertsarkitekturer (esf-07k.7). arm64-leggen bygges
      # under QEMU-emulering på en amd64-runner, og det er den dyre delen.
      #
      # Første forsøk satte timeout-minutes: 15 basert på en lokal måling på
      # Apple Silicon (~2,3x for den emulerte leggen). Den målingen var for
      # optimistisk: på en ekte amd64-runner ble jobben AVBRUTT på 15 minutter
      # uten å bli ferdig. Derfor 45 minutter og buildx-cache mot GitHub
      # Actions-cachen, så bare første kjøring betaler full pris.
      #
      # Jobben kjører bare på push til main og har ingen pull_request-trigger,
      # så den blokkerer ingen PR-tilbakemelding uansett hvor lang den er.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t eiriksf:ci .

  lighthouse:
    name: Lighthouse performance & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      # Gate at >=0.90, not the bead's aspirational >=0.95: a real local run
      # (CV 95, homepage 94/95 Lighthouse "performance" score, see
      # .lighthouserc.json) found the homepage one point under 95, caused by
      # the theme-init script's deliberately render-blocking <script src>
      # (prevents a flash of the wrong theme — a tradeoff made on purpose in
      # an earlier CSP-hardening pass, not something to undo for one point).
      # 0.90 is a real, passing-today floor with headroom for normal CI
      # variance; treat 94/95 as the baseline to beat, not 95 as a promise.
      #
      # Same approach for categories:accessibility, gated at >=0.90: a local
      # `lhci autorun` across all 5 collected URLs (3 runs each, see
      # .lighthouserc.json) measured a floor of 0.93 (homepage, /cv,
      # /innlegg) with /ki and the sampled post page at 0.96 — fully stable,
      # no run-to-run variance observed. Known causes of the 0.93/0.96
      # (not fixed here, tracked as follow-up): insufficient color-contrast
      # ratio on some text; non-sequential heading order on /, /cv and
      # /innlegg; and an aria-label on the site logo link that doesn't match
      # its visible text (label-content-name-mismatch, informational only,
      # zero score weight). 0.90 leaves ~3 points of headroom below the
      # measured floor; it is not an aspirational 0.95+.
      # Tilgjengelighetsporten stod på 0.90 da den ble satt, mot et målt gulv
      # på 0.93. Etter esf-al3 (kontrasttokens) og esf-1m3 (tilgjengelige
      # navn, overskriftsnivå, fokuserbare rullefelt) scorer alle fem URL-ene
      # 1.00, tre kjøringer hver, uten variasjon. Porten står på 0.99: det
      # minste enkeltfradraget som betyr noe (vekt 3, f.eks. heading-order)
      # tar scoren til 0.98 og blir dermed fanget.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: "./.lighthouserc.json"

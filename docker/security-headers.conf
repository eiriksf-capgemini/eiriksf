# Sikkerhetsheadere for alt nginx serverer.
#
# Ligger i en egen snippet fordi nginx sin add_header ikke arves ned i en
# location-blokk som selv setter en add_header - den ERSTATTER hele settet
# fra server-blokken, og `always` endrer ikke på det. Da vi satte Cache-
# Control på /_next/static/, forsvant derfor samtlige sikkerhetsheadere for
# alle JS-bundlene uten at noe sa fra (esf-07k.17). Derfor: inkluder denne
# i hver eneste location-blokk som setter en header selv.
#
# Snippeten kan ikke ligge under /etc/nginx/conf.d/ - alt som matcher *.conf
# der blir auto-inkludert som server-kontekst av hovedkonfigen. Den kan
# heller ikke ligge i en ny underkatalog: COPY --chmod gir katalogen den
# oppretter samme modus, og 644 uten x-bit gjør at nginx ikke kommer inn i
# den. Derfor rett i /etc/nginx.
#
# NB om CSP: script-src har 'unsafe-inline'. Next.js (App Router) injiserer
# selv inline <script>-tagger per side for RSC-hydrering
# (self.__next_f.push(...)), uavhengig av vårt eget innhold. Å fjerne
# 'unsafe-inline' helt krever enten per-request-nonces (krever en app-server
# - ikke mulig med statisk eksport + rent nginx) eller en build-time
# CSP-hash-pipeline per side (prototypet og fungerte, men vurdert som
# uforholdsmessig kompleksitet for en statisk side uten brukerinnhold). Vårt
# eget tema-init-script er likevel flyttet til en ekstern, innholds-hashet
# fil (se scripts/generate-theme-init.mjs).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

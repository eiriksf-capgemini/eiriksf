server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Next sine hashede bundles kan caches "for alltid" – filnavnet endrer seg
    # når innholdet gjør det.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # trailingSlash: true → /cv/ → /cv/index.html. Fall tilbake til .html for direkte filer.
    #
    # HTML må revalideres hver gang. Uten en eksplisitt Cache-Control står
    # cacher fritt til å gjette seg til friskhet ut fra Last-Modified (RFC
    # 9111), og en side som ikke er rørt på et døgn kan da bli liggende i
    # nettleserens cache i timevis etter en deploy. no-cache betyr ikke "ikke
    # lagre", men "spør alltid først" – med ETag blir svaret som regel et
    # billig 304 (esf-07k.17).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}

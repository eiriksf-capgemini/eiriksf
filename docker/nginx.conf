server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sikkerhetsheadere – enkel baseline for en statisk side.
    # NB: script-src har 'unsafe-inline'. Next.js (App Router) injiserer selv
    # inline <script>-tagger per side for RSC-hydrering (self.__next_f.push(...)),
    # uavhengig av vårt eget innhold. Å fjerne 'unsafe-inline' helt krever enten
    # per-request-nonces (krever en app-server – ikke mulig med statisk eksport
    # + rent nginx) eller en build-time CSP-hash-pipeline per side (prototypet og
    # fungerte, men vurdert som uforholdsmessig kompleksitet/skjørhet for en
    # statisk portfolio-side uten brukerinnhold – det reelle XSS-angrepsflaten
    # 'unsafe-inline' her beskytter mot er minimal når det ikke finnes noe
    # injeksjonspunkt for brukerdata i utgangspunktet). Vårt eget tema-init-
    # script er likevel flyttet til en ekstern, innholds-hashet fil (se
    # scripts/generate-theme-init.mjs) – det er ett mindre inline-script, selv
    # om 'unsafe-inline' fortsatt er nødvendig for Next sine egne.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Next sine hashede bundles kan caches "for alltid"
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # trailingSlash: true → /cv/ → /cv/index.html. Fall tilbake til .html for direkte filer.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
